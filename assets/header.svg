<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
<title id="t">Utsha Basak</title>
<desc id="d">Full-Stack, Android, Security and Machine Learning, over an animated circuit board</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset=".55" stop-color="#0f2027"/><stop offset="1" stop-color="#132f3a"/></linearGradient>
<radialGradient id="halo" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#38bdf8" stop-opacity=".18"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#38bdf8" fill-opacity=".09"/></pattern>
<linearGradient id="name" x1="0" x2="1"><stop offset="0" stop-color="#e0f2fe"/><stop offset=".5" stop-color="#7dd3fc"/><stop offset="1" stop-color="#c4b5fd"/></linearGradient>
<filter id="glow" x="-20%" y="-40%" width="140%" height="180%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="r"><rect width="1200" height="300" rx="14"/></clipPath>
</defs>
<style>
.t{fill:none;stroke-width:2;stroke-linejoin:round}
.p{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dashoffset:var(--l);animation-name:run}
@keyframes run{to{stroke-dashoffset:0}}
.n{animation-name:blink;animation-iteration-count:infinite}
@keyframes blink{0%,100%{fill:#0b1220}50%{fill:currentColor}}
.g{font:600 15px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#7dd3fc;opacity:0;animation:rise 9s ease-in-out infinite}
@keyframes rise{0%{opacity:0;transform:translateY(0)}20%{opacity:.35}80%{opacity:.2}100%{opacity:0;transform:translateY(-120px)}}
.name{font:800 66px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;letter-spacing:1px}
.sub{font:600 19px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#7dd3fc;letter-spacing:.5px}
.cmd{font:500 15px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#94a3b8}
.cur{animation:caret 1.1s steps(1) infinite}
@keyframes caret{50%{opacity:0}}
.in{opacity:0;animation:in 1.2s ease-out .2s forwards}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.scan{animation:scan 6s linear infinite}
@keyframes scan{from{transform:translateY(-40px)}to{transform:translateY(340px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.in,.g{opacity:1}.p{stroke-dashoffset:0}}
</style>
