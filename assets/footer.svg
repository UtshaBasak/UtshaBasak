16324a"/><path d="M1210,65 L1170,65 L1170,85 L1090,85 L1050,85 L970,85 L970,65 L900,65" class="p" stroke="#a78bfa" stroke-dasharray="26 390" style="--l:416px;animation:run 5.7s linear 0.59s infinite"/><circle cx="900" cy="65" r="4" fill="#0b1220" stroke="#a78bfa" stroke-width="2" class="n" style="color:#a78bfa;animation-delay:5.43s;animation-duration:5.7s"/><path d="M1210,100 L1170,100 L1170,80 L1130,80 L1030,80 L1030,100 L970,100 L910,100 L910,110 L860,110" class="t" stroke="#16324a"/><path d="M1210,100 L1170,100 L1170,80 L1130,80 L1030,80 L1030,100 L970,100 L910,100 L910,110 L860,110" class="p" stroke="#22d3ee" stroke-dasharray="26 440" style="--l:466px;animation:run 5.32s linear 0.58s infinite"/><circle cx="860" cy="110" r="4" fill="#0b1220" stroke="#22d3ee" stroke-width="2" class="n" style="color:#22d3ee;animation-delay:5.10s;animation-duration:5.32s"/>
<text x="600" y="62" text-anchor="middle" class="msg">Thanks for visiting<tspan class="cur" fill="#38bdf8"> ▌</tspan></text>
<text x="600" y="90" text-anchor="middle" class="dim">// connection kept alive · see you in the commits</text>
</g>
