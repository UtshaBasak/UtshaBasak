<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="130" viewBox="0 0 1200 130" role="img" aria-labelledby="t">
<title id="t">Thanks for visiting</title>
<defs>
<linearGradient id="bg" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#0b1220"/><stop offset=".55" stop-color="#0f2027"/><stop offset="1" stop-color="#132f3a"/></linearGradient>
<pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#38bdf8" fill-opacity=".09"/></pattern>
<clipPath id="r"><rect width="1200" height="130" rx="14"/></clipPath>
</defs>
<style>
.t{fill:none;stroke-width:2;stroke-linejoin:round}
.p{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dashoffset:var(--l);animation-name:run}
@keyframes run{to{stroke-dashoffset:0}}
.n{animation-name:blink;animation-iteration-count:infinite}
@keyframes blink{0%,100%{fill:#0b1220}50%{fill:currentColor}}
.msg{font:600 18px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#7dd3fc}
.dim{font:500 13px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#94a3b8}
.cur{animation:caret 1.1s steps(1) infinite}
@keyframes caret{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.p{stroke-dashoffset:0}}
</style>
<g clip-path="url(#r)">
<rect width="1200" height="130" fill="url(#bg)"/>
<rect width="1200" height="130" fill="url(#grid)"/>
